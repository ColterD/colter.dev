<!doctype html>
<!-- og.png source — render at exactly 1200x630 (playwright), output to public/og.png.
     Not served; kept in-repo so the card can be regenerated after edits. -->
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:'Lexend'; src:url('public/fonts/lexend-var.woff2') format('woff2'); font-weight:100 900; font-display:block; }
  * { box-sizing:border-box; margin:0; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  body {
    background:#0E0A1A;
    font-family:'Lexend',system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;
    position:relative;
  }
  .vignette { position:absolute; inset:0;
    background:
      radial-gradient(120% 90% at 50% 30%, transparent 40%, rgba(7,4,16,.62) 100%),
      linear-gradient(180deg, rgba(7,4,16,.3), transparent 30%, transparent 70%, rgba(7,4,16,.4));
  }
  #stars { position:absolute; inset:0; }
  .comet { position:absolute; top:92px; right:148px; width:250px; height:6px; border-radius:3px;
    background:linear-gradient(270deg,#9D7BE0, rgba(157,123,224,0)); transform:rotate(24deg); }
  .comet::after { content:''; position:absolute; right:-9px; top:-6px; width:18px; height:18px; border-radius:50%;
    background:#B49AEE; box-shadow:0 0 22px 6px rgba(157,123,224,.55); }
  .mark { position:relative; z-index:2; width:64px; height:64px; }
  h1 { position:relative; z-index:2; color:#F3EEFA; font-size:92px; font-weight:680; letter-spacing:-0.02em; line-height:1.05; }
  .tag { position:relative; z-index:2; color:#C6B8DC; font-size:33px; font-weight:400; letter-spacing:.06em; }
  .tag b { color:#9D7BE0; font-weight:500; }
  .url { position:absolute; right:44px; bottom:32px; z-index:2; color:#8A7DA3; font-size:22px; letter-spacing:.12em; }
</style>
</head>
<body>
  <canvas id="stars" width="1200" height="630"></canvas>
  <div class="vignette"></div>
  <div class="comet"></div>
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
    <defs><linearGradient id="t" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9D7BE0"/><stop offset="1" stop-color="#9D7BE0" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="M52 8 L16 44" stroke="url(#t)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="52" cy="8" r="8.5" fill="#9D7BE0"/>
  </svg>
  <h1>Colter Dahlberg</h1>
  <div class="tag">Systems Engineering <b>·</b> AI <b>·</b> Open Source</div>
  <div class="url">colter.dev</div>
<script>
  // deterministic starfield (mulberry32, seed 1337) so og.png is reproducible
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  const rnd=mulberry32(1337), c=document.getElementById('stars'), x=c.getContext('2d');
  for(let i=0;i<170;i++){
    const px=rnd()*1200, py=rnd()*630, r=0.6+rnd()*1.9, a=0.22+rnd()*0.62;
    const purple=rnd()<0.12;
    x.beginPath(); x.arc(px,py,r,0,Math.PI*2);
    x.fillStyle=`rgba(${purple?'157,123,224':'255,255,255'},${a.toFixed(2)})`; x.fill();
  }
</script>
</body>
</html>
